
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco-Detective: Desafío Local</title>
     <script>
        // MODO DISEÑADOR: Cambia a true si quieres que al hacer clic te diga las coordenadas (X, Y) para configurar tus imágenes reales
        const MODO_DISEÑADOR = true; 

        // CONFIGURACIÓN AVANZADA DE NIVELES Y MÚLTIPLES IMPACTOS
        const niveles = [
            {
                nivel: 1,
                entorno: "Oficina",
                imagen: "oficina1.png", // Asegúrate de que coincida con el nombre y extensión de tu archivo
                impactosRequeridos: 4, // Cuántos debe encontrar para ganar este nivel
                impactos: [
                    { nombre: "Luz encendida en espacio vacío", X: 50, Y: 15, radio: 8, encontrado: false },
                    { nombre: "Computador encendido sin usuario", X: 30, Y: 45, radio: 7, encontrado: false },
                    { nombre: "Cargador conectado sin uso", X: 45, Y: 52, radio: 5, encontrado: false },
                    { nombre: "Botella plástica en basura ordinaria", X: 80, Y: 75, radio: 6, encontrado: false },
                    { nombre: "Hojas impresas innecesariamente", X: 25, Y: 60, radio: 6, encontrado: false },
                    { nombre: "Llave del lavamanos abierta", X: 85, Y: 40, radio: 7, encontrado: false }
                ]
            },
            {
                nivel: 2,
                entorno: "Terraza",
                imagen: "terraza.png",
                impactosRequeridos: 5,
                impactos: [
                    { nombre: "Vaso desechable utilizado", X: 20, Y: 50, radio: 6, encontrado: false },
                    { nombre: "Alimento desperdiciado", X: 35, Y: 55, radio: 7, encontrado: false },
                    { nombre: "Llave abierta", X: 70, Y: 45, radio: 7, encontrado: false },
                    { nombre: "Residuo orgánico mal clasificado", X: 75, Y: 80, radio: 8, encontrado: false },
                    { nombre: "Envase contaminado con comida", X: 82, Y: 78, radio: 6, encontrado: false },
                    { nombre: "Servilletas en exceso", X: 40, Y: 48, radio: 5, encontrado: false },
                    { nombre: "Luces encendidas en zona vacía", X: 50, Y: 10, radio: 9, encontrado: false },
                    { nombre: "Botella plástica desechable", X: 15, Y: 65, radio: 6, encontrado: false }
                ]
            },
            {
                nivel: 3,
                entorno: "Hogar",
                imagen: "hogar.png",
                impactosRequeridos: 6,
                impactos: [
                    { nombre: "Luz encendida innecesariamente", X: 45, Y: 12, radio: 8, encontrado: false },
                    { nombre: "Monitor encendido", X: 28, Y: 40, radio: 7, encontrado: false },
                    { nombre: "Cargador conectado", X: 35, Y: 48, radio: 5, encontrado: false },
                    { nombre: "Aire acondicionado con ventana abierta", X: 60, Y: 25, radio: 12, encontrado: false },
                    { nombre: "Llave goteando", X: 78, Y: 55, radio: 6, encontrado: false },
                    { nombre: "Papel impreso por una sola cara", X: 22, Y: 52, radio: 6, encontrado: false },
                    { nombre: "Residuo mal separado", X: 85, Y: 82, radio: 8, encontrado: false },
                    { nombre: "Batería en residuos comunes", X: 88, Y: 85, radio: 4, encontrado: false },
                    { nombre: "Botella desechable", X: 12, Y: 70, radio: 6, encontrado: false },
                    { nombre: "Planta regada excesivamente", X: 92, Y: 65, radio: 9, encontrado: false },
                    { nombre: "Archivo físico duplicado", X: 50, Y: 50, radio: 6, encontrado: false },
                    { nombre: "Almacenamiento digital saturado", X: 30, Y: 35, radio: 6, encontrado: false }
                ]
            }
        ];

        let nombreJugador = "";
        let nivelActual = 0;
        let encontradosEnNivel = 0;
        let tiempoInicio;
        let intervaloTiempo;
        let tiempoTotalAcumulado = 0;
        let penalizacionTiempo = 0;

        let rankingLocal = [
            { nombre: "EcoMaster", tiempo: 45.20 },
            { nombre: "GreenSpy", tiempo: 58.15 },
            { nombre: "PlanetaSalvo", tiempo: 72.40 }
        ];

        document.getElementById("btn-iniciar").onclick = iniciarJuego;
        document.getElementById("btn-siguiente").onclick = siguienteNivel;
        document.getElementById("btn-reiniciar").onclick = reiniciarTodo;
        document.getElementById("imagen-escenario").onclick = registrarClic;

        function iniciarJuego() {
            nombreJugador = document.getElementById("nombre-jugador").value.trim();
            if (!nombreJugador) return alert("Por favor, ingresa tu nombre de detective.");
            
            cambiarPantalla("pantalla-juego");
            nivelActual = 0;
            tiempoTotalAcumulado = 0;
            penalizacionTiempo = 0;
            cargarNivel();
        }

        function cargarNivel() {
            encontradosEnNivel = 0;
            document.getElementById("btn-siguiente").style.display = "none";
            
            const datosNivel = niveles[nivelActual];
            document.getElementById("info-nivel").innerText = `Nivel ${datosNivel.nivel}: ${datosNivel.entorno}`;
            document.getElementById("imagen-escenario").src = datosNivel.imagen;
            
            // Reiniciar estado de impactos para este intento
            datosNivel.impactos.forEach(imp => imp.encontrado = false);
            
            actualizarMensajeObjetivos();
            document.querySelectorAll('.marcador').forEach(m => m.remove());

            tiempoInicio = performance.now();
            intervaloTiempo = setInterval(() => {
                let tiempoActual = (performance.now() - tiempoInicio) / 1000;
                let tiempoDesplegado = tiempoTotalAcumulado + tiempoActual + penalizacionTiempo;
                document.getElementById("cronometro").innerText = tiempoDesplegado.toFixed(2) + "s";
            }, 40);
        }

        function actualizarMensajeObjetivos() {
            const datosNivel = niveles[nivelActual];
            document.getElementById("mensaje").innerHTML = `<strong>Objetivo:</strong> Encuentra ${datosNivel.impactosRequeridos} impactos ambientales en la imagen.<br>Llevas: <strong>${encontradosEnNivel} de ${datosNivel.impactosRequeridos}</strong>`;
        }

        function registrarClic(event) {
            const img = document.getElementById("imagen-escenario");
            const rect = img.getBoundingClientRect();
            const clickX = ((event.clientX - rect.left) / rect.width) * 100;
            const clickY = ((event.clientY - rect.top) / rect.height) * 100;

            // Ayuda en Modo Diseñador para configurar tus fotos reales
            if (MODO_DISEÑADOR) {
                console.log(`Clic detectado en -> X: ${clickX.toFixed(1)}, Y: ${clickY.toFixed(1)}`);
            }

            const datosNivel = niveles[nivelActual];
            
            // Si ya completó los requeridos en este nivel, ignorar más clics hasta que avance
            if (encontradosEnNivel >= datosNivel.impactosRequeridos) return;

            let impactoDetectado = null;

            // Buscar si el clic colisionó con algún impacto de la lista
            for (let imp of datosNivel.impactos) {
                if (imp.encontrado) continue; // Ignorar si ya se descubrió antes

                let distancia = Math.sqrt(Math.pow(clickX - imp.X, 2) + Math.pow(clickY - imp.Y, 2));
                if (distancia <= imp.radio) {
                    impactoDetectado = imp;
                    break;
                }
            }

            const marcador = document.createElement("div");
            marcador.classList.add("marcador");
            marcador.style.left = `${clickX}%`;
            marcador.style.top = `${clickY}%`;

            if (impactoDetectado) {
                // ¡Acierto!
                impactoDetectado.encontrado = true;
                encontradosEnNivel++;
                
                marcador.classList.add("correcto");
                marcador.style.width = `${impactoDetectado.radio * 2}%`;
                marcador.style.height = `${impactoDetectado.radio * 2 * (rect.width / rect.height)}%`;
                
                alert(`¡Excelente! Encontraste: ${impactoDetectado.nombre}`);
                actualizarMensajeObjetivos();

                // Comprobar si ya ganó el nivel entero
                if (encontradosEnNivel >= datosNivel.impactosRequeridos) {
                    clearInterval(intervaloTiempo);
                    let tiempoNivel = (performance.now() - tiempoInicio) / 1000;
                    tiempoTotalAcumulado += tiempoNivel;

                    document.getElementById("mensaje").innerHTML = "<strong>¡Felicidades!</strong> Encontraste los impactos necesarios para este escenario.";
                    document.getElementById("btn-siguiente").style.display = "inline-block";
                }
            } else {
                // ¡Fallo! Clic incorrecto
                penalizacionTiempo += 3;
                mostrarAlertaPenalizacion();
                
                marcador.classList.add("incorrecto");
                marcador.style.width = "6%"; // Tamaño estándar para el error
                marcador.style.height = `${6 * (rect.width / rect.height)}%`;
            }
            document.getElementById("contenedor-juego").appendChild(marcador);
        }

        function mostrarAlertaPenalizacion() {
            const alerta = document.getElementById("alerta-penalizacion");
            alerta.style.display = "block";
            setTimeout(() => { alerta.style.display = "none"; }, 600);
        }

        function siguienteNivel() {
            if (nivelActual < niveles.length - 1) {
                nivelActual++;
                cargarNivel();
            } else {
                guardarPuntajeLocal();
            }
        }

        function guardarPuntajeLocal() {
   function guardarPuntajeLocal() {
            let tiempoFinal = tiempoTotalAcumulado + penalizacionTiempo;
            
            rankingLocal.push({
                nombre: nombreJugador,
                tiempo: parseFloat(tiempoFinal.toFixed(2))
            });

            rankingLocal.sort((a, b) => a.tiempo - b.tiempo);
            actualizarTablaHTML();
            cambiarPantalla("pantalla-ranking");
        }

        function actualizarTablaHTML() {
            const tbody = document.getElementById("cuerpo-tabla");
            tbody.innerHTML = "";
            const top10 = rankingLocal.slice(0, 10);
            
            top10.forEach((registro, indice) => {
                let puesto = indice + 1;
                tbody.innerHTML += `
                    <tr>
                        <td>${puesto === 1 ? '🥇 1' : puesto === 2 ? '🥈 2' : puesto === 3 ? '🥉 3' : puesto}</td>
                        <td><strong>${registro.nombre}</strong></td>
                        <td>${registro.tiempo.toFixed(2)}s</td>
                    </tr>`;
            });
        }

        function cambiarPantalla(idPantalla) {
            document.querySelectorAll('.pantalla').forEach(p => p.style.display = 'none');
            document.getElementById(idPantalla).style.display = 'block';
        }

        function reiniciarTodo() {
            document.getElementById("nombre-jugador").value = "";
            cambiarPantalla("pantalla-inicio");
        }
    </script>
</body>
</html>
